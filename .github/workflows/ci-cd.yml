name: CI and container delivery

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    # tests, typecheck, lint, build

  containers:
    needs: validate
    # docker build on PR
    # docker build + push on master
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: huddle_test
          POSTGRES_USER: huddle
          POSTGRES_PASSWORD: huddle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huddle -d huddle_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://huddle:huddle@127.0.0.1:5432/huddle_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Test and type-check server
        working-directory: server
        run: bun run db:migrate && bun test --coverage && bun run typecheck
      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Lint and build client
        working-directory: client
        run: bun run lint && bun run build

  containers:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            context: ./server
          - image: client
            context: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
