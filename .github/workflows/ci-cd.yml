name: CI and container delivery

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: huddle_test
          POSTGRES_USER: huddle
          POSTGRES_PASSWORD: huddle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huddle -d huddle_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://huddle:huddle@127.0.0.1:5432/huddle_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Test and type-check server
        working-directory: server
        run: |
          bun run db:generate
          bun run db:migrate
          bun test test/core test/domain test/features
          bun test test/interfaces
          bun run typecheck
      - name: Validate migrations against populated legacy data
        working-directory: server
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: huddle
          PGPASSWORD: huddle
        run: |
          createdb huddle_migration_upgrade
          psql --dbname=huddle_migration_upgrade --no-psqlrc --set=ON_ERROR_STOP=1 --file=test/migrations/upgrade.sql
      - name: Install client dependencies
        working-directory: client
        run: bun install --frozen-lockfile
      - name: Lint and build client
        working-directory: client
        run: bun run lint && bun run build
      - name: Install Chromium
        working-directory: client
        run: bunx playwright install --with-deps chromium
      - name: Validate critical browser flows
        working-directory: client
        env:
          CORS_ORIGINS: http://127.0.0.1:5173
          AUTH_ATTEMPTS_PER_MINUTE: 1000
          REQUESTS_PER_MINUTE: 5000
        run: bun run e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            context: ./server
          - image: client
            context: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
