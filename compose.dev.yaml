services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      CORS_ORIGINS: ${APP_ORIGIN:-http://localhost:8080},${DESKTOP_ORIGIN:-huddle://app},http://localhost:8081
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - huddle-data:/app/data
    restart: "no"

  client:
    build:
      context: ./client
      dockerfile: web/Dockerfile.dev
    environment:
      VITE_API_URL: /api
      VITE_DEV_PROXY_TARGET: http://server:3000
    volumes:
      - ./client:/app
      - client-workspace-node-modules:/app/node_modules
      - /app/web/node_modules
      - /app/shared/node_modules
    restart: "no"

volumes:
  client-workspace-node-modules:
  server-node-modules:
