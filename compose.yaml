name: huddle

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huddle}
      POSTGRES_USER: ${POSTGRES_USER:-huddle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huddle}
    volumes:
      - huddle-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: ./server
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://huddle:huddle@database:5432/huddle?schema=public}
      UPLOADS_PATH: /app/data/uploads
      TENOR_API_KEY: ${TENOR_API_KEY:-}
      TENOR_CLIENT_KEY: ${TENOR_CLIENT_KEY:-huddle}
      CORS_ORIGINS: ${APP_ORIGIN:-http://localhost:8080}
    volumes:
      - huddle-data:/app/data
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
        VITE_TURN_URL: ${TURN_URL:-}
        VITE_TURN_USERNAME: ${TURN_USERNAME:-}
        VITE_TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  huddle-data:
  huddle-postgres:
